<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignPad - Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .subtitle {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    #root {
      margin-top: 1rem;
    }

    .demo-info {
      background: #f9f9f9;
      border-left: 3px solid #ddd;
      padding: 1rem;
      border-radius: 4px;
      margin-top: 2rem;
    }

    .demo-info h3 {
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .demo-info p {
      color: #555;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .demo-info code {
      background: #eee;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
    }

    .card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 1.25rem;
      margin-top: 1.5rem;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 0.75rem;
      color: #111;
    }

    .card h2 code,
    .subtitle code {
      background: #eef2ff;
      color: #4338ca;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }

    .pad-wrap {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 4px;
      background: #fff;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 0.75rem;
      margin-top: 1rem;
    }

    .control {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.85rem;
      color: #374151;
    }

    .control input[type="range"] {
      width: 100%;
    }

    .control input[type="color"] {
      width: 48px;
      height: 32px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 0;
      background: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      align-items: center;
    }

    .toolbar select {
      padding: 0.45rem 0.6rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .toolbar button {
      padding: 0.45rem 0.9rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .toolbar button:hover:not(:disabled) {
      background: #f3f4f6;
      border-color: #9ca3af;
    }

    .toolbar button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .preview {
      margin-top: 1rem;
      padding: 0.75rem;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
    }

    .preview p {
      font-size: 0.8rem;
      color: #6b7280;
      margin-bottom: 0.5rem;
    }

    .preview img {
      max-width: 100%;
      background:
        linear-gradient(45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(-45deg, #e5e7eb 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #e5e7eb 75%),
        linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0;
      border-radius: 4px;
    }

    .log {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #059669;
      font-family: 'Courier New', monospace;
    }

    .code-toggle {
      margin-top: 1rem;
      padding: 0.4rem 0.8rem;
      border: 1px dashed #9ca3af;
      border-radius: 6px;
      background: #f8fafc;
      cursor: pointer;
      font-size: 0.8rem;
      color: #334155;
    }

    .code-block {
      position: relative;
      margin-top: 0.75rem;
    }

    .code-copy {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      padding: 0.3rem 0.6rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 0.75rem;
      z-index: 1;
    }

    .code-block pre {
      margin: 0;
      padding: 1rem;
      padding-top: 2.2rem;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 8px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.78rem;
      line-height: 1.5;
    }

    .code-block code {
      white-space: pre;
    }

    .status {
      margin-top: 0.75rem;
      font-size: 0.8rem;
      color: #64748b;
    }

    /* Ajustes de escritorio (móvil queda igual / responsive) */
    @media (min-width: 768px) {
      .container {
        max-width: 960px;
        padding: 2.5rem;
      }

      .controls {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }

      .toolbar {
        gap: 0.6rem;
      }

      .toolbar select,
      .toolbar button {
        font-size: 0.9rem;
        padding: 0.5rem 1rem;
      }

      .pad-wrap {
        min-height: 320px;
      }

      .code-block pre {
        font-size: 0.82rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="root"></div>
  </div>

  <script type="module" src="/App.jsx"></script>
</body>
</html>
