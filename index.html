<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignPad - Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 2rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 800px;
      width: 100%;
    }

    h1 {
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 1.5rem;
    }

    .subtitle {
      color: #666;
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    #root {
      margin-top: 1rem;
    }

    .demo-info {
      background: #f9f9f9;
      border-left: 3px solid #ddd;
      padding: 1rem;
      border-radius: 4px;
      margin-top: 2rem;
    }

    .demo-info h3 {
      color: #333;
      margin-bottom: 0.5rem;
      font-size: 1rem;
    }

    .demo-info p {
      color: #555;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .demo-info code {
      background: #eee;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>SignPad Demo</h1>
    
    
    <div id="root"></div>
  </div>

  <script type="module" src="/App.jsx"></script>
</body>
</html>
